---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.jackson.FindJacksonMigrationImpact
displayName: Find Jackson migration impact
description: >-
  Inventory Jackson source API boundaries together with resolved Jackson and Azure dependencies in Maven and Gradle.
  Dependency presence is context, not proof that a module requires Jackson 2. Shared Jackson annotations are reported
  separately. Run before migration, while the original types and build models still resolve. Does not migrate code
  or dependencies; dependency searches may add search markers.
recipeList:
  - org.openrewrite.java.jackson.FindJacksonMigrationBoundaries
  - org.openrewrite.maven.search.DependencyInsight:
      groupIdPattern: 'com.fasterxml.jackson*'
      artifactIdPattern: '*'
  - org.openrewrite.maven.search.DependencyInsight:
      groupIdPattern: 'tools.jackson*'
      artifactIdPattern: '*'
  - org.openrewrite.maven.search.DependencyInsight:
      groupIdPattern: 'com.azure*'
      artifactIdPattern: '*'
  - org.openrewrite.gradle.search.DependencyInsight:
      groupIdPattern: 'com.fasterxml.jackson*'
      artifactIdPattern: '*'
  - org.openrewrite.gradle.search.DependencyInsight:
      groupIdPattern: 'tools.jackson*'
      artifactIdPattern: '*'
  - org.openrewrite.gradle.search.DependencyInsight:
      groupIdPattern: 'com.azure*'
      artifactIdPattern: '*'
