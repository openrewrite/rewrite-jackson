---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.jackson.CodehausModulesToFasterXML
displayName: Migrate the Jackson Codehaus (legacy) companion modules to Jackson FasterXML
description: >-
  Moves the types of the Jackson 1 `jackson-jaxrs`, `jackson-xc`, `jackson-smile` and `jackson-mrbean` modules to their
  counterparts in `jackson-jaxrs-json-provider`, `jackson-module-jaxb-annotations`, `jackson-dataformat-smile` and
  `jackson-module-mrbean`. Types with no Jackson 2 counterpart, such as `XmlAdapterJsonSerializer`, keep their Jackson 1
  names.
tags:
  - jackson-2
preconditions:
  - org.openrewrite.java.search.HasType:
      fullyQualifiedTypeName: org.codehaus.jackson..*
      checkAssignability: false
recipeList:
  # jaxrs
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.codehaus.jackson.jaxrs.Annotations
      newFullyQualifiedTypeName: com.fasterxml.jackson.jaxrs.cfg.Annotations
  - org.openrewrite.java.ChangeType:
