      newFullyQualifiedTypeName: com.fasterxml.jackson.databind.DeserializationFeature

  # One move per public type of jackson-core-asl and jackson-mapper-asl 1.9.13 that has a counterpart in jackson-core,
  # jackson-databind or jackson-annotations 2.6 and 2.23, rather than package moves, which would also carry the types
  # Jackson 2 dropped, such as `JodaSerializers` and `CustomSerializerFactory`, to names that do not exist. Nested
  # types that Jackson 2 relocated come before the type they are nested in, which would otherwise carry them along.
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.codehaus.jackson.map.DeserializerFactory$Config
      newFullyQualifiedTypeName: com.fasterxml.jackson.databind.cfg.DeserializerFactoryConfig
