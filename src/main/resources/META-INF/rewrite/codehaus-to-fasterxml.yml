---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.jackson.codehaus.MigrateJodaSerializers
displayName: Migrate Jackson Codehaus (legacy) Joda serializers to `jackson-datatype-joda`
description: >-
  Jackson 1 handled Joda types in `jackson-mapper-asl`, through `JodaSerializers` and `JodaDeserializers`. Jackson 2
  moved that support to the `jackson-datatype-joda` module. Moves each Jackson 1 Joda serializer and deserializer, such as
  the one named in `@JsonSerialize(using = JodaSerializers.DateTimeSerializer.class)`, to its counterpart in
  `jackson-datatype-joda`, and adds that module where they are used. `FindJackson1TypesWithoutJackson2Equivalent` marks
  the other references to `JodaSerializers` and `JodaDeserializers`, where registering `JodaModule` takes their place.
tags:
  - jackson-2
preconditions:
  - org.openrewrite.java.search.HasType:
      fullyQualifiedTypeName: org.codehaus.jackson.map.ext..*
      checkAssignability: false
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.codehaus.jackson.map.ext.JodaSerializers$DateMidnightSerializer
      newFullyQualifiedTypeName: com.fasterxml.jackson.datatype.joda.ser.DateMidnightSerializer
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.codehaus.jackson.map.ext.JodaSerializers$DateTimeSerializer
      newFullyQualifiedTypeName: com.fasterxml.jackson.datatype.joda.ser.DateTimeSerializer
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.codehaus.jackson.map.ext.JodaSerializers$LocalDateSerializer
      newFullyQualifiedTypeName: com.fasterxml.jackson.datatype.joda.ser.LocalDateSerializer
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.codehaus.jackson.map.ext.JodaSerializers$LocalDateTimeSerializer
      newFullyQualifiedTypeName: com.fasterxml.jackson.datatype.joda.ser.LocalDateTimeSerializer
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.codehaus.jackson.map.ext.JodaDeserializers$DateMidnightDeserializer
      newFullyQualifiedTypeName: com.fasterxml.jackson.datatype.joda.deser.DateMidnightDeserializer
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.codehaus.jackson.map.ext.JodaDeserializers$DateTimeDeserializer
      newFullyQualifiedTypeName: com.fasterxml.jackson.datatype.joda.deser.DateTimeDeserializer
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.codehaus.jackson.map.ext.JodaDeserializers$LocalDateDeserializer
      newFullyQualifiedTypeName: com.fasterxml.jackson.datatype.joda.deser.LocalDateDeserializer
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.codehaus.jackson.map.ext.JodaDeserializers$LocalDateTimeDeserializer
      newFullyQualifiedTypeName: com.fasterxml.jackson.datatype.joda.deser.LocalDateTimeDeserializer
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.codehaus.jackson.map.ext.JodaDeserializers$PeriodDeserializer
      newFullyQualifiedTypeName: com.fasterxml.jackson.datatype.joda.deser.PeriodDeserializer
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: com.fasterxml.jackson.datatype
      artifactId: jackson-datatype-joda
      version: 2.x
      onlyIfUsing: org.codehaus.jackson.map.ext.JodaSerializers..*
      familyPattern: com.fasterxml.jackson*
      acceptTransitive: true
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: com.fasterxml.jackson.datatype
      artifactId: jackson-datatype-joda
      version: 2.x
      onlyIfUsing: org.codehaus.jackson.map.ext.JodaDeserializers..*
      familyPattern: com.fasterxml.jackson*
      acceptTransitive: true
