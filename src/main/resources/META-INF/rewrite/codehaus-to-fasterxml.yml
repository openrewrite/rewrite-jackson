      newMethodName: asBoolean
      matchOverrides: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonNode getPath(..)
      newMethodName: path
      matchOverrides: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.map.ObjectMapper getJsonFactory()
      newMethodName: getFactory
      matchOverrides: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.map.ObjectMapper defaultPrettyPrintingWriter()
      newMethodName: writerWithDefaultPrettyPrinter
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.map.ObjectMapper prettyPrintingWriter(..)
      newMethodName: writer
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.map.ObjectMapper filteredWriter(..)
      newMethodName: writer
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.map.ObjectMapper schemaBasedWriter(..)
      newMethodName: writer
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.map.ObjectMapper viewWriter(..)
      newMethodName: writerWithView
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.map.ObjectMapper typedWriter(..)
      newMethodName: writerFor
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.map.ObjectMapper updatingReader(..)
      newMethodName: readerForUpdating
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.map.ObjectMapper schemaBasedReader(..)
      newMethodName: reader
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.map.ObjectMapper withModule(..)
      newMethodName: registerModule
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.map.ObjectMapper readValue(org.codehaus.jackson.JsonNode, java.lang.Class)
      newMethodName: treeToValue
      matchOverrides: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.map.ObjectMapper readValue(org.codehaus.jackson.JsonNode, org.codehaus.jackson.type.JavaType)
      newMethodName: treeToValue
      matchOverrides: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.map.ObjectMapper readValue(org.codehaus.jackson.JsonNode, org.codehaus.jackson.type.TypeReference)
      newMethodName: convertValue
      matchOverrides: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonParser enableFeature(..)
      newMethodName: enable
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonParser disableFeature(..)
      newMethodName: disable
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonParser setFeature(..)
      newMethodName: configure
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonParser isFeatureEnabled(..)
      newMethodName: isEnabled
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonGenerator enableFeature(..)
      newMethodName: enable
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonGenerator disableFeature(..)
      newMethodName: disable
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonGenerator setFeature(..)
      newMethodName: configure
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonGenerator isFeatureEnabled(..)
      newMethodName: isEnabled
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonFactory enableParserFeature(..)
      newMethodName: enable
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonFactory disableParserFeature(..)
      newMethodName: disable
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonFactory setParserFeature(..)
      newMethodName: configure
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonFactory isParserFeatureEnabled(..)
      newMethodName: isEnabled
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonFactory enableGeneratorFeature(..)
      newMethodName: enable
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonFactory disableGeneratorFeature(..)
      newMethodName: disable
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonFactory setGeneratorFeature(..)
      newMethodName: configure
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonFactory isGeneratorFeatureEnabled(..)
      newMethodName: isEnabled
  # Jackson 2 dropped createJsonGenerator(File, JsonEncoding) and deprecated the other createJson* methods
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonFactory createJsonParser(..)
      newMethodName: createParser
      matchOverrides: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.codehaus.jackson.JsonFactory createJsonGenerator(..)
      newMethodName: createGenerator
      matchOverrides: true

  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.codehaus.jackson.map.JsonSerializer
      newFullyQualifiedTypeName: com.fasterxml.jackson.databind.JsonSerializer
  - org.openrewrite.java.ChangeType:
